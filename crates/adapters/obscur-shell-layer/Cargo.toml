[package]
name = "obscur-shell-layer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
obscur-geometry = { workspace = true }
obscur-identity = { workspace = true }
obscur-interaction = { workspace = true }
obscur-windowing = { workspace = true }
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
# `wp_fractional_scale_v1` (staging) + `wp_viewporter` (stable): SCTK wraps
# neither, so the adapter dispatches them itself.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
raw-window-handle = "0.6"
# The event loop: a Wayland source, a ping for external wake-ups, and timers.
# Without it the loop blocks on its own socket and nothing outside can reach it.
calloop = "0.13"
calloop-wayland-source = "0.3"
