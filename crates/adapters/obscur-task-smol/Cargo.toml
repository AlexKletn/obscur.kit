[package]
name = "obscur-task-smol"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
obscur-task = { workspace = true }
async-executor = "1"
async-io = "2"
futures-lite = "2"
async-channel = "2"
# smol's own blocking thread pool, the ecosystem's answer to `BlockingExecutor`
# (`smol::unblock` is a re-export of `blocking::unblock`). Deliberately NOT the
# `async-executor` above: a blocking job run on that executor would occupy the
# single worker thread `SmolSpawner` drives it with, stalling every spawned
# future and every `SmolTimer` wake sharing it. Licence "Apache-2.0 OR MIT"
# (blocking-1.6.2/Cargo.toml), both on deny.toml's allow list.
blocking = "1"

[lints]
workspace = true
