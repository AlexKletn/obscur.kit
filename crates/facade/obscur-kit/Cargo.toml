[package]
name = "obscur-kit"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# The portable default adapter set: works on any target with no display/GPU
# (software renderer + smol executor + filesystem resources + image decode).
default = ["resource-fs", "resource-decode", "cache-fs", "task-smol", "render-cpu"]
# Convenience: every optional adapter (needs a display/GPU/AT at runtime).
full = [
    "resource-fs",
    "resource-decode",
    "cache-fs",
    "task-smol",
    "task-tokio",
    "render-cpu",
    "render-vello",
    "window-winit",
    "accesskit",
    "text-harfrust",
    "text-unicode",
]
resource-decode = ["dep:obscur-resource-decode"]
resource-fs = ["dep:obscur-resource-fs"]
cache-fs = ["dep:obscur-cache-fs"]
task-smol = ["dep:obscur-task-smol"]
task-tokio = ["dep:obscur-task-tokio"]
render-cpu = ["dep:obscur-render-cpu"]
render-vello = ["dep:obscur-render-vello"]
window-winit = ["dep:obscur-window-winit"]
accesskit = ["dep:obscur-accessibility-accesskit"]
text-harfrust = ["dep:obscur-text-harfrust"]
text-unicode = ["dep:obscur-text-unicode"]

[dependencies]
# foundation
obscur-identity = { workspace = true }
obscur-geometry = { workspace = true }
obscur-capability = { workspace = true }
obscur-diagnostics = { workspace = true }
obscur-task = { workspace = true }
# domain
obscur-view = { workspace = true }
obscur-tree = { workspace = true }
obscur-style = { workspace = true }
obscur-layout = { workspace = true }
obscur-scene = { workspace = true }
obscur-text = { workspace = true }
obscur-motion = { workspace = true }
obscur-render = { workspace = true }
obscur-windowing = { workspace = true }
obscur-resources = { workspace = true }
obscur-routing = { workspace = true }
obscur-accessibility = { workspace = true }
obscur-data-transfer = { workspace = true }
obscur-system = { workspace = true }
obscur-interaction = { workspace = true }
# application
obscur-runtime = { workspace = true }
obscur-headless = { workspace = true }
# components
obscur-theme-system = { workspace = true }
obscur-primitives = { workspace = true }
obscur-widgets = { workspace = true }
# frontends (UI authoring surfaces)
obscur-ui-ir = { workspace = true }
obscur-okui-syntax = { workspace = true }
obscur-okui-compiler = { workspace = true }
obscur-css = { workspace = true }
obscur-ui-macros = { workspace = true }
# optional adapters (behind features)
obscur-resource-decode = { workspace = true, optional = true }
obscur-resource-fs = { workspace = true, optional = true }
obscur-cache-fs = { workspace = true, optional = true }
obscur-task-smol = { workspace = true, optional = true }
obscur-task-tokio = { workspace = true, optional = true }
obscur-render-cpu = { workspace = true, optional = true }
obscur-render-vello = { workspace = true, optional = true }
obscur-window-winit = { workspace = true, optional = true }
obscur-accessibility-accesskit = { workspace = true, optional = true }
obscur-text-harfrust = { workspace = true, optional = true }
obscur-text-unicode = { workspace = true, optional = true }

# The platform system provider is selected automatically by target.
[target.'cfg(target_os = "linux")'.dependencies]
obscur-system-linux = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
obscur-system-web = { workspace = true }

# Real platform backends for the `windowed_counter` / `showcase_window` examples
# only. Versions match the adapters the `full` feature re-exports
# (obscur-window-winit pins winit 0.30; obscur-render-vello pins wgpu 29).
[dev-dependencies]
winit = "0.30"
wgpu = "29"
pollster = "0.4"
# PNG encoding for the headless-Vello example's read-back pixels (already a
# workspace dependency via the CPU renderer; not a new external dependency).
tiny-skia = "0.11"

[[example]]
name = "windowed_counter"
required-features = ["full"]

# Proof that CSS `filter: blur()` renders as a REAL gaussian through our own wgpu
# pass over Vello: a sharp hard-edged checkerboard beside the same checkerboard
# under a blur layer, rendered headless to `target/blur_proof.png`. Needs the GPU
# adapter at runtime but no window; gated on the Vello backend only.
[[example]]
name = "blur_proof"
required-features = ["render-vello"]

# Proof that CSS `backdrop-filter: blur()` renders as REAL frosted glass / acrylic
# through our own segmented wgpu compositing over Vello: a hard-edged checkerboard
# backdrop with a translucent rounded panel on top whose backdrop is blurred in
# place, rendered headless to `target/backdrop_proof.png`. Needs the GPU adapter at
# runtime but no window; gated on the Vello backend only.
[[example]]
name = "backdrop_proof"
required-features = ["render-vello"]

# Proof that the CSS color-matrix `filter` functions (grayscale/brightness/
# saturate/invert/hue-rotate/sepia) render as REAL per-pixel affine transforms
# through our own wgpu color-matrix pass over Vello: a colourful reference element
# beside copies each wrapped in a `ColorMatrix` layer, rendered headless to
# `target/color_filter_proof.png`. Needs the GPU adapter at runtime but no window;
# gated on the Vello backend only.
[[example]]
name = "color_filter_proof"
required-features = ["render-vello"]

# Proof that CSS `repeating-linear-gradient()` tiles as REAL diagonal stripes via
# Vello's `ExtendMode::Repeat`: one box painted with a 12px-period 45° stripe,
# driven through the full CSS → runtime → Vello path and read back to
# `target/repeating_gradient_proof.png`. Needs the GPU adapter at runtime but no
# window; gated on the Vello backend only.
[[example]]
name = "repeating_gradient_proof"
required-features = ["render-vello"]

# Proof that a MULTI-LAYER `background-image` (a comma list) paints all layers
# back-to-front: one box whose `background-image` is two crossing
# `repeating-linear-gradient()`s over a `background-color`, driven through the full
# CSS → runtime → Vello path and read back to `target/multi_bg_proof.png` as a
# crossing graph-paper grid (both line sets). Needs the GPU adapter at runtime but
# no window; gated on the Vello backend only.
[[example]]
name = "multi_bg_proof"
required-features = ["render-vello"]

# Proof that CSS gradient GEOMETRY is canonical: three wide (non-square) boxes —
# `linear-gradient(to top right)` (aspect-ratio-aware corner direction, not 45°),
# `radial-gradient(closest-side circle)`, and `radial-gradient(ellipse
# farthest-corner)` (a stretched oval, rx≠ry) — driven through the full CSS →
# runtime → Vello path and read back to `target/gradient_geometry_proof.png`. Needs
# the GPU adapter at runtime but no window; gated on the Vello backend only.
[[example]]
name = "gradient_geometry_proof"
required-features = ["render-vello"]

# Proof that CSS gradients interpolate in OKLAB (CSS Images 4 default): two
# horizontal `linear-gradient(red, green)` / `linear-gradient(blue, yellow)` bands
# driven through the full CSS → runtime → Vello path and read back to
# `target/gradient_oklab_proof.png`. Self-asserts the red→green midpoint pixel is
# the vivid Oklab yellow-green (green channel well above the muddy sRGB ceiling),
# proving Vello honors `Gradient::interpolation_cs = Oklab`. Needs the GPU adapter
# at runtime but no window; gated on the Vello backend only.
[[example]]
name = "gradient_oklab_proof"
required-features = ["render-vello"]

# Proof that `border-style: dashed` renders as REAL dashes: two boxes (square +
# rounded) with a `2px dashed` border, stroked as a dashed path and rasterized
# headless through the CPU renderer to `target/dashed_border_proof.png`. Verifies
# the dash/gap pattern in-process. No window or GPU; gated on the CPU backend.
[[example]]
name = "dashed_border_proof"
required-features = ["render-cpu"]

# Proof that the CSS border-triangle trick renders: four 0×0 boxes with three
# transparent border sides and one inked side draw the four cardinal arrow
# triangles (▽ ▲ ▷ ◁), plus a 4-colour mitered bordered box, rasterized headless
# through the CPU renderer to `target/border_triangle_proof.png`. Verifies each
# triangle is filled at its centroid yet empty at an outside corner. No window/GPU.
[[example]]
name = "border_triangle_proof"
required-features = ["render-cpu"]

# Proof that `outline` + `outline-offset` paints a focus ring OUTSIDE the border
# box: three filled boxes (dashed-outline, solid-outline, rounded) each with a
# `2px` outline offset `3px`, stroked as the coordinator emits and rasterized
# headless through the CPU renderer to `target/outline_proof.png`. Verifies the
# ring sits outside the box with a visible offset gap. No window or GPU.
[[example]]
name = "outline_proof"
required-features = ["render-cpu"]

# Proof that an `inset` box-shadow renders INSIDE the box: two light boxes over a
# grey page, one with a crisp inner ring (`0 0 0 3px inset`) and one with a soft
# inner shadow (`inset 0 4px 8px`), rasterized headless through the CPU renderer to
# `target/inset_shadow_proof.png`. Verifies the ring is inked at the box edge, clear
# at the center, and untouched outside the box (no bleed). No window or GPU.
[[example]]
name = "inset_shadow_proof"
required-features = ["render-cpu"]

# Proof of CSS `overflow` clipping: two 100×60 boxes, each holding a child that
# extends beyond it. The left box is `overflow: hidden` (the child is clipped to
# the box edges); the right box is `overflow: visible` (the child overflows). It
# drives the REAL scene coordinator (which emits the PushClip/PopClip) and
# rasterizes headless through the CPU renderer to `target/overflow_proof.png`.
[[example]]
name = "overflow_proof"
required-features = ["render-cpu"]

# Proof of the CSS 2.1 §9.9 seven-layer paint order (catalog bug B2): a positioned
# `z:auto` box that comes EARLIER in the tree than a non-positioned block still
# paints ON TOP of it (layer 6 > layers 1–5), while a negative-z positioned box
# paints UNDER a non-positioned sibling that comes earlier. Drives the REAL scene
# coordinator and rasterizes headless through the CPU renderer to
# `target/stacking_order_proof.png`.
[[example]]
name = "stacking_order_proof"
required-features = ["render-cpu"]

# Proof of the built-in UA default stylesheet: bare Button/Input/Checkbox rendered
# with only the UA sheet installed (base look) over the same controls with a
# one-line author `button` override (author wins). Needs the CPU renderer + the
# text stack (labels), but no window, GPU, or filesystem — builds display-free.
[[example]]
name = "ua_default_proof"
required-features = ["render-cpu", "text-harfrust", "text-unicode"]

# Proof that the :disabled / :checked pseudo-classes bite from widget state.
[[example]]
name = "pseudo_state_proof"
required-features = ["render-cpu", "text-harfrust", "text-unicode"]

# Proof of multi-line auto-wrapping text + CSS `line-height`: a long paragraph
# wraps at a ~200px box width, an explicit `\n` forces a second line, and a
# `line-height: 2` block spaces its wrapped lines twice as far apart. Drives the
# REAL runtime + coordinator and rasterizes headless through the CPU renderer to
# `target/multiline_text_proof.png`. Needs the CPU renderer + the text stack.
[[example]]
name = "multiline_text_proof"
required-features = ["render-cpu", "text-harfrust", "text-unicode"]

# The headless capability showcase → PNG. Needs the CPU renderer, filesystem
# image loading + decode, and the real text shaping stack — but no window or GPU,
# so it builds and runs anywhere (`cargo build --examples` stays display-free).
[[example]]
name = "showcase_png"
required-features = [
    "render-cpu",
    "resource-fs",
    "resource-decode",
    "text-harfrust",
    "text-unicode",
]

# The `.okui` DSL showcase → View bridge → headless CPU → PNG. Drives the real
# frontend pipeline (parse → compile → UI IR → View bridge) and rasterizes the
# bridged view with the software backend. Same runtime feature set as
# `showcase_png` (no window or GPU), so it builds and runs display-free.
[[example]]
name = "showcase_okui_png"
required-features = [
    "render-cpu",
    "resource-fs",
    "resource-decode",
    "text-harfrust",
    "text-unicode",
]

# The imported UI-Kit theme-switcher + Material 3 gallery → PNG. One
# theme-agnostic view + a swappable per-theme stylesheet, rasterized headless.
# Same runtime feature set as `showcase_png` (no window or GPU).
[[example]]
name = "uikit_png"
required-features = [
    "render-cpu",
    "resource-fs",
    "resource-decode",
    "text-harfrust",
    "text-unicode",
]

# The Browser Elements Wireframe Kit → PNG: a grayscale, flat "spec sheet" of every
# native HTML control across all of its states, authored as one semantic view + a
# wireframe user-agent stylesheet and rasterized headless through the CPU backend.
# Same runtime feature set as `uikit_png` (no window or GPU), so it builds and runs
# display-free.
[[example]]
name = "wireframe_png"
required-features = [
    "render-cpu",
    "resource-fs",
    "resource-decode",
    "text-harfrust",
    "text-unicode",
]

# The Browser Elements Wireframe Kit → PNG rendered FAITHFULLY through headless
# Vello/wgpu: the same shared view + wireframe stylesheet as `wireframe_png`,
# rasterized offscreen on the GPU and read back to pixels, so the graph-paper page
# grid + the indeterminate-progress / meter / colour-swatch `repeating-linear-
# gradient` hatches are REAL (not the CPU flat-first-stop approximation). Needs the
# GPU adapter at runtime but no window; gated on the Vello backend + resource/text.
[[example]]
name = "wireframe_vello_png"
required-features = [
    "render-vello",
    "resource-fs",
    "resource-decode",
    "text-harfrust",
    "text-unicode",
]

# The imported UI-Kit → PNG rendered FAITHFULLY through headless Vello/wgpu: the
# same shared view + per-theme stylesheet as `uikit_png`, rasterized offscreen on
# the GPU and read back to pixels, so the Skeuomorphic theme's gradients + inset/
# outset shadows are REAL (not the CPU approximation). Needs the GPU adapter at
# runtime but no window; gated on the Vello backend + resource/text stack.
[[example]]
name = "uikit_vello_png"
required-features = [
    "render-vello",
    "resource-fs",
    "resource-decode",
    "text-harfrust",
    "text-unicode",
]

# The windowed GPU capability showcase: the SAME shared scene as `showcase_png`,
# rendered through winit + Vello at full effect fidelity and made interactive.
# Needs the window + GPU adapters plus image loading/decode and the text stack,
# so it is gated on the full backend set (a display/GPU are required at runtime).
[[example]]
name = "showcase_window"
required-features = [
    "render-vello",
    "window-winit",
    "resource-fs",
    "resource-decode",
    "text-harfrust",
    "text-unicode",
]

# The windowed, INTERACTIVE imported UI-Kit theme switcher: the SAME shared view +
# per-theme stylesheets as `uikit_png` / `uikit_vello_png`, rendered through winit +
# Vello, with clickable tabs that live-swap the stylesheet at full GPU fidelity.
# Needs the window + GPU adapters plus the resource/text stack, so it is gated on
# the same backend set as `showcase_window` (a display/GPU are required at runtime).
[[example]]
name = "uikit_window"
required-features = [
    "render-vello",
    "window-winit",
    "resource-fs",
    "resource-decode",
    "text-harfrust",
    "text-unicode",
]
