[package]
name = "obscur-runtime"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
obscur-identity = { workspace = true }
obscur-accessibility = { workspace = true }
obscur-geometry = { workspace = true }
obscur-diagnostics = { workspace = true }
obscur-task = { workspace = true }
obscur-view = { workspace = true }
obscur-tree = { workspace = true }
obscur-style = { workspace = true }
obscur-text = { workspace = true }
obscur-localization = { workspace = true }
obscur-motion = { workspace = true }
obscur-layout = { workspace = true }
obscur-scene = { workspace = true }
obscur-resources = { workspace = true }
obscur-interaction = { workspace = true }
obscur-data-transfer = { workspace = true }
# Unicode extended grapheme-cluster segmentation (UAX #29): the runtime resolves a
# Backspace/Delete on a collapsed caret to a whole user-perceived cluster (a
# combining sequence or ZWJ emoji) before driving the pure editing buffer, whose
# own grapheme motion is a documented one-`char` approximation (spec §5.11).
unicode-segmentation = { workspace = true }
