[workspace]
resolver = "3"
members = [
    "crates/foundation/*",
    "crates/domain/*",
    "crates/application/*",
    "crates/frontend/*",
    "crates/components/*",
    "crates/adapters/*",
    "crates/diagnostics/*",
    "crates/plugin/*",
    "crates/facade/*",
    "tools/*",
]
default-members = ["crates/application/obscur-runtime"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/obscur-kit"

# All external and internal dependency versions are centralised here (spec §4.1, §5.1).
[workspace.dependencies]
# foundation
obscur-identity = { path = "crates/foundation/obscur-identity" }
obscur-geometry = { path = "crates/foundation/obscur-geometry" }
obscur-capability = { path = "crates/foundation/obscur-capability" }
obscur-task = { path = "crates/foundation/obscur-task" }
obscur-diagnostics = { path = "crates/foundation/obscur-diagnostics" }
# domain
obscur-view = { path = "crates/domain/obscur-view" }
obscur-tree = { path = "crates/domain/obscur-tree" }
obscur-style = { path = "crates/domain/obscur-style" }
obscur-layout = { path = "crates/domain/obscur-layout" }
obscur-resources = { path = "crates/domain/obscur-resources" }
obscur-scene = { path = "crates/domain/obscur-scene" }
obscur-render = { path = "crates/domain/obscur-render" }
# application
obscur-runtime = { path = "crates/application/obscur-runtime" }
obscur-headless = { path = "crates/application/obscur-headless" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
# Spec §3.3 mandates same-name entity files (e.g. diagnostic/diagnostic.rs).
module_inception = "allow"
