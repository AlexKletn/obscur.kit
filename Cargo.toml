[workspace]
resolver = "3"
members = [
    "crates/foundation/*",
    "crates/domain/*",
    "crates/application/*",
    "crates/frontend/*",
    "crates/components/*",
    "crates/adapters/*",
    "crates/diagnostics/*",
    "crates/plugin/*",
    "crates/facade/*",
    "tools/*",
]
default-members = ["crates/application/obscur-runtime"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/AlexKletn/obscur.kit"

# All external and internal dependency versions are centralised here (spec §4.1, §5.1).
[workspace.dependencies]
# foundation
obscur-identity = { path = "crates/foundation/obscur-identity" }
obscur-geometry = { path = "crates/foundation/obscur-geometry" }
obscur-capability = { path = "crates/foundation/obscur-capability" }
obscur-task = { path = "crates/foundation/obscur-task" }
obscur-diagnostics = { path = "crates/foundation/obscur-diagnostics" }
# domain
obscur-plugin-model = { path = "crates/plugin/obscur-plugin-model" }
obscur-plugin-abi = { path = "crates/plugin/obscur-plugin-abi" }
obscur-plugin-api = { path = "crates/plugin/obscur-plugin-api" }
obscur-plugin-package = { path = "crates/plugin/obscur-plugin-package" }
obscur-plugin-host = { path = "crates/plugin/obscur-plugin-host" }
obscur-plugin-executor-process = { path = "crates/plugin/obscur-plugin-executor-process" }
obscur-plugin-executor-native = { path = "crates/plugin/obscur-plugin-executor-native" }
obscur-plugin-executor-wasm = { path = "crates/plugin/obscur-plugin-executor-wasm" }
obscur-view = { path = "crates/domain/obscur-view" }
obscur-tree = { path = "crates/domain/obscur-tree" }
obscur-style = { path = "crates/domain/obscur-style" }
obscur-layout = { path = "crates/domain/obscur-layout" }
obscur-resources = { path = "crates/domain/obscur-resources" }
obscur-scene = { path = "crates/domain/obscur-scene" }
obscur-render = { path = "crates/domain/obscur-render" }
obscur-windowing = { path = "crates/domain/obscur-windowing" }
obscur-text = { path = "crates/domain/obscur-text" }
obscur-localization = { path = "crates/domain/obscur-localization" }
obscur-motion = { path = "crates/domain/obscur-motion" }
obscur-interaction = { path = "crates/domain/obscur-interaction" }
obscur-routing = { path = "crates/domain/obscur-routing" }
obscur-accessibility = { path = "crates/domain/obscur-accessibility" }
obscur-data-transfer = { path = "crates/domain/obscur-data-transfer" }
obscur-system = { path = "crates/domain/obscur-system" }
# application
obscur-runtime = { path = "crates/application/obscur-runtime" }
obscur-headless = { path = "crates/application/obscur-headless" }
obscur-testkit = { path = "crates/application/obscur-testkit" }
# components
obscur-theme-system = { path = "crates/components/obscur-theme-system" }
obscur-primitives = { path = "crates/components/obscur-primitives" }
obscur-widgets = { path = "crates/components/obscur-widgets" }
# diagnostics
obscur-devtools-protocol = { path = "crates/diagnostics/obscur-devtools-protocol" }
obscur-devtools-server = { path = "crates/diagnostics/obscur-devtools-server" }
# frontend
obscur-ui-ir = { path = "crates/frontend/obscur-ui-ir" }
obscur-okui-syntax = { path = "crates/frontend/obscur-okui-syntax" }
obscur-okui-compiler = { path = "crates/frontend/obscur-okui-compiler" }
obscur-css = { path = "crates/frontend/obscur-css" }
obscur-ui-macros = { path = "crates/frontend/obscur-ui-macros" }
# proc-macro toolchain (obscur-ui-macros expansion logic)
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "extra-traits"] }
# external decode crates (adapters only; forbidden in pure domain per spec §5.6)
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
ttf-parser = "0.25.1"
usvg = { version = "0.46", default-features = false }
# Pure-Rust HarfBuzz port for real text shaping (adapter-only; spec §5.10). Its
# `FontRef`/`Direction`/`Language` re-export `read-fonts` for shaping.
harfrust = "0.10"
# The font-table parser underlying `harfrust` (same version it pins), used by the
# harfrust adapter to read real vertical metrics (`hhea`) for line metrics. Kept
# at harfrust's exact requirement so the two resolve to one build.
read-fonts = "0.40.2"
# Glyph-outline extraction (unhinted) used by the CPU renderer adapter to
# rasterize real glyph shapes into a `tiny-skia` path (adapter-only; spec §5.2).
# Pinned to the version already resolved in the lockfile so it shares one build.
skrifa = "0.42.1"
# Per-character Unicode `Script` property (ISO-15924) for script itemization
# (adapter-only; spec §5.10).
unicode-script = "0.5.8"
# Unicode Bidirectional Algorithm (UAX #9) for per-byte embedding levels driving
# direction itemization (adapter-only; spec §5.10).
unicode-bidi = "0.3.18"
# Unicode canonical composition (NFC) for the css-fonts-4 §5.3 canonical-equivalence
# rule: a decomposed cluster (base + combining marks) that is canonically
# equivalent to a single precomposed character shapes to that character's single
# glyph when the font supports it (spec §5.10 font fallback / §5.18).
unicode-normalization = "0.1.25"
# Unicode extended grapheme-cluster segmentation (UAX #29) for the editing engine's
# deletion/navigation granularity: one Backspace removes one user-perceived cluster
# (a combining sequence or ZWJ emoji), not one code point (spec §5.11).
unicode-segmentation = "1.13.3"
# Knuth-Liang hyphenation patterns for real in-word break points (adapter-only;
# spec §5.10). Confined to the hyphenation adapter so the pure `obscur-text`
# domain carries no pattern tables. `embed_en-us` compiles the US-English
# dictionary into the binary so it loads with no runtime file access.
hyphenation = { version = "0.8.4", features = ["embed_en-us"] }
# adapters (optional, wired by the facade behind features)
obscur-resource-decode = { path = "crates/adapters/obscur-resource-decode" }
obscur-resource-fs = { path = "crates/adapters/obscur-resource-fs" }
obscur-cache-fs = { path = "crates/adapters/obscur-cache-fs" }
obscur-task-smol = { path = "crates/adapters/obscur-task-smol" }
obscur-task-tokio = { path = "crates/adapters/obscur-task-tokio" }
obscur-render-cpu = { path = "crates/adapters/obscur-render-cpu" }
obscur-render-vello = { path = "crates/adapters/obscur-render-vello" }
obscur-window-winit = { path = "crates/adapters/obscur-window-winit" }
obscur-shell-layer = { path = "crates/adapters/obscur-shell-layer" }
obscur-wayland-effects = { path = "crates/adapters/obscur-wayland-effects" }
obscur-accessibility-accesskit = { path = "crates/adapters/obscur-accessibility-accesskit" }
obscur-system-linux = { path = "crates/adapters/obscur-system-linux" }
obscur-system-web = { path = "crates/adapters/obscur-system-web" }
obscur-text-harfrust = { path = "crates/adapters/obscur-text-harfrust" }
obscur-text-unicode = { path = "crates/adapters/obscur-text-unicode" }
obscur-text-hyphenation = { path = "crates/adapters/obscur-text-hyphenation" }
obscur-font-fontconfig = { path = "crates/adapters/obscur-font-fontconfig" }

# Plugin manifests and streamed package validation
serde = { version = "1", features = ["derive"] }
icu_decimal = { version = "~2.1.1", features = ["alloc"] }
icu_datetime = "~2.1.1"
icu_experimental = "~0.4.0"
icu_locale_core = "~2.1.1"
writeable = "0.6"
serde_json = "1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
flate2 = "1"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
zstd = { version = "0.13", default-features = false }
tempfile = "3.27"
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
too_many_lines = "allow"
# Spec §3.3 mandates same-name entity files (e.g. diagnostic/diagnostic.rs).
module_inception = "allow"
# Curated pedantic exceptions — these fire heavily and by design in this codebase:
# Geometry/motion/style compare exact f32 values on purpose (equality of scale
# factors, interpolation endpoints, is_noop checks), and tests assert exact,
# representable values.
float_cmp = "allow"
# Flags ordinary capitalised prose (API names, acronyms) in doc comments; low
# signal, high volume across the spec-derived docs.
doc_markdown = "allow"
# Deliberate near-name pairs (anchor/author, along/across, leading/trailing).
similar_names = "allow"
# usize->f32 for small bounded counts (grid columns, item indices) is intentional.
cast_precision_loss = "allow"
# Several value objects are spec-mandated boolean bundles (window/input/command
# state, privacy policy); a bitflag rewrite would obscure the 1:1 spec mapping.
struct_excessive_bools = "allow"

# Measured 2026-08-12 with callgrind on a 227-node frame, because wall clock on
# this box has a wider spread (0.276-0.331 ms) than the effect being looked for.
# Cargo's release defaults are `lto = false, codegen-units = 16`, and on a
# workspace of forty crates written one entity to a file that costs real work:
# almost nothing crosses a crate boundary inlined.
#
#   default                       123.75 M instructions/frame
#   lto = "thin", cgu = 1         104.31 M   -15.7%
#   lto = "fat",  cgu = 1         no better than the default, and slower to build
#
# The dev profile is untouched, so `cargo check` and the default `cargo test`
# pay nothing for this; only a release build is slower to produce.
[profile.release]
lto = "thin"
codegen-units = 1
