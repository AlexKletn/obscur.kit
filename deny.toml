# cargo-deny configuration (spec §5.10 dependency advisory scan).
[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "BSD-3-Clause", "Zlib"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
